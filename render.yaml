# =============================================================================
# RENDER.COM BLUEPRINT - Smile E-commerce
# =============================================================================
# Ce fichier définit l'infrastructure complète pour déployer sur Render.com
# 
# Pour déployer:
# 1. Push ce repo sur GitHub
# 2. Connectez votre compte GitHub à Render.com
# 3. Créez un nouveau "Blueprint" et sélectionnez ce repo
# 4. Render créera automatiquement tous les services
# =============================================================================

services:
  # ==========================================================================
  # SERVICE WEB - Application Django
  # ==========================================================================
  - type: web
    name: smile-shop
    runtime: docker
    dockerfilePath: ./smile/Dockerfile.render
    dockerContext: ./smile
    plan: free  # Plan gratuit de Render
    region: frankfurt  # Plus proche de la France
    
    # Variables d'environnement
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smile-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "smile.settings_render"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WEB_CONCURRENCY
        value: "2"
    
    # Healthcheck
    healthCheckPath: /health/

  # ==========================================================================
  # BASE DE DONNÉES - PostgreSQL
  # ==========================================================================
databases:
  - name: smile-db
    databaseName: smile_db
    user: smile_user
    plan: free  # Plan gratuit avec 256MB
    region: frankfurt
