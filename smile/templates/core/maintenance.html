{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Site en maintenance" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .maintenance-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .gear-icon {
            font-size: 5rem;
            color: #f59e0b;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <i class="bi bi-gear gear-icon"></i>
        <h1 class="h3 mt-4 mb-3">{% trans "Site en maintenance" %}</h1>
        <p class="text-muted mb-4">
            {{ maintenance_message|default:"Le site est actuellement en maintenance. Revenez bientôt!" }}
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="mailto:contact@example.com" class="btn btn-outline-primary">
                <i class="bi bi-envelope me-2"></i>{% trans "Contact" %}
            </a>
        </div>
        <hr class="my-4">
        <p class="small text-muted mb-0">
            <i class="bi bi-clock me-1"></i>
            {% trans "Nous serons bientôt de retour!" %}
        </p>
    </div>
</body>
</html>
